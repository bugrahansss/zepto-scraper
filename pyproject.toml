[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zepto-scraper"
version = "0.1.0"
description = "Scrape Zepto category listings (price, MRP, discount, stock) and product details (seller, shelf life, FSSAI licence) with Python."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Buğrahan Saka" }]
keywords = ["zepto", "web scraping", "quick commerce", "grocery", "scraper", "nextjs", "india"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["requests>=2.25"]

[project.urls]
Homepage = "https://github.com/bugrahansss/zepto-scraper"
Source = "https://github.com/bugrahansss/zepto-scraper"
Issues = "https://github.com/bugrahansss/zepto-scraper/issues"
"Scrape.do" = "https://scrape.do/?utm_source=pypi&utm_medium=package&utm_campaign=zepto-scraper"

[project.scripts]
zepto-scraper = "zepto_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
